# Creates the vX.Y.Z tag (read from package.json) on the merge commit of every PR
# merged into main. If that tag already exists it does nothing, so PRs without a
# version bump (docs, hotfixes) pass through untouched. Preview tags stay manual.
name: Tag release

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create the version tag
        env:
          # Passed through env, not interpolated into the script: the title is free text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version is not X.Y.Z: $version"
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$PR_TITLE"
          git push origin "refs/tags/$tag"
          echo "::notice::Created $tag on $(git rev-parse --short HEAD)"
