minimumReleaseAge: 1440
# pnpm bloquea los scripts de instalación por defecto. playwright necesita el
# suyo para resolver los navegadores (aquí ya están en ~/.cache/ms-playwright,
# así que es un no-op, pero tiene que poder correr).
onlyBuiltDependencies:
  - playwright

overrides:
  ajv@>=7.0.0-alpha.0 <8.18.0: ^8.18.0
  brace-expansion@<1.1.18: ^1.1.18
  fast-uri@>=3.0.0 <3.1.5: ^3.1.6
  minimatch@<3.1.4: ^3.1.4
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  ua-parser-js@>=2.0.1 <2.0.10: ^2.0.10
